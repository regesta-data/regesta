#
# M0 CI: typecheck, tests (schema validates all reference cases, CLA logic, checks), dependency licences
# against the allowlist (06-recht.md 8.2), build rules B2-1/B2-2/B3-1/G1 on CC BY data, and B1-2 (ScanCode).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test and checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for check-paths (laufdaten/ never in a commit)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (schema, reference cases, CLA, checks)
        run: npm test
      - name: Dependency licences (allowlist)
        run: npm run check:licenses
      - name: Build rules B2-1, B3-1, G1 on CC BY data
        run: npm run check:rules
      - name: Raw archive never in Git (laufdaten/, decision 24.10.2026)
        run: npm run check:paths

  scancode:
    name: foreign code scan (B1-2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install ScanCode
        # pluggy is pinned because plugincode 32.0.0 does not load with pluggy 1.6 or later.
        run: pip install "scancode-toolkit-mini==32.5.0" "pluggy==1.5.0"
      - name: Scan own code
        run: |
          node scripts/scancode-gate.ts stage "$RUNNER_TEMP/scan-input"
          scancode --license --copyright --json-pp scancode-results.json --processes 2 "$RUNNER_TEMP/scan-input"
      - name: Gate
        run: node scripts/scancode-gate.ts check scancode-results.json
